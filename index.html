<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Library App</title>
  <link rel="stylesheet" href="./normalize.css">
  <link rel="stylesheet" href="./styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>My Library</h1>
    </header>

    <main>
      <div class="container">
        <section class="library" aria-labelledby="library-heading">
          <h2 id="library-heading" class="sr-only">Book collection</h2>
          <div class="book-list"></div>
          <p class="empty-state" hidden>No books in your library yet. Add a book to get started.</p>
        </section>
        <div class="btn-container">
          <button type="button" class="new-book-btn">Add New Book</button>
        </div>
      </div>
    </main>

    <!-- Modal to add new book to library -->
    <dialog id="modal" class="modal" aria-labelledby="add-book-heading">
      <div class="modal-content">
        <button type="button" class="close-btn" aria-label="Close add book dialog">
          <span aria-hidden="true">&times;</span>
        </button>
        <h2 id="add-book-heading">Add New Book</h2>
        <form class="new-book-form">
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" required>

          <label for="author">Author:</label>
          <input type="text" id="author" name="author" required>

          <label for="pages">Pages:</label>
          <input type="number" id="pages" name="pages" min="1" step="1" inputmode="numeric" aria-describedby="pages-hint" required>
          <span id="pages-hint" class="sr-only">Enter a whole number greater than zero.</span>

          <label class="checkbox-field">
            <span>Read?</span>
            <input type="checkbox" id="read-check" name="read">
          </label>

          <button type="submit" class="add-book-btn">Add Book</button>
        </form>
      </div>
    </dialog>

    <!-- Dialog to confirm removal of book from library -->
    <dialog id="remove-dialog" class="remove-dialog" aria-labelledby="remove-dialog-heading" aria-describedby="remove-dialog-description">
      <h2 id="remove-dialog-heading">Are You Sure You Want To Remove This Book?</h2>
      <p id="remove-dialog-description"></p>
      <div class="remove-actions">
        <button type="button" class="confirm-remove-btn">Yes, I'm Sure</button>
        <button type="button" class="cancel-remove-btn">Cancel</button>
      </div>
    </dialog>

    <p class="sr-only" aria-live="polite" aria-atomic="true" id="status-announcement"></p>

    <footer>
      <p>Copyright &copy; <a href="https://github.com/ComfyClicks">ComfyClicks</a> 2024</p>
    </footer>
  </div>
</body>
</html>
